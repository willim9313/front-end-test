<svg xmlns="http://www.w3.org/2000/svg" width="505" height="370" viewBox="0 0 505 370">
  <!-- Original drawing for this page: an ojisan in profile reading a spread newspaper. -->
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <filter id="wash"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.78  0 0 0 0 0.75  0 0 0 -1.2 1.3"/>
      <feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="505" height="370" fill="#fff"/>
  <!-- watercolour shadow on the table -->
  <path d="M40 330 C 140 312 330 312 470 326 C 420 350 160 352 40 342 Z" fill="#D2C6C0" filter="url(#wash)"/>
  <path d="M40 330 C 140 312 330 312 470 326 C 420 350 160 352 40 342 Z" fill="#D2C6C0" opacity="0.55"/>
  <g filter="url(#wobble)" stroke="#3C3C3C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- rounded back, cut by the left edge -->
    <path d="M-10 196 C 40 150 110 128 168 140 C 196 146 206 160 204 178" fill="#fff"/>
    <path d="M-10 196 L-10 330 L210 330 L214 214" fill="#fff" stroke="none"/>
    <path d="M204 178 C 214 214 214 270 206 330" fill="none"/>
    <!-- head -->
    <path d="M196 132 C 186 96 196 52 238 46 C 276 42 296 66 296 92 L 304 108 C 306 114 300 118 294 118 C 296 132 290 146 276 152 C 258 160 228 158 210 150 Z" fill="#EA908A"/>
    <!-- hair: a dark band round the back, bald on top -->
    <path d="M200 120 C 190 92 200 64 226 54 C 214 72 214 96 222 112 Z" fill="#3C3C3C"/>
    <!-- ear -->
    <path d="M222 104 C 210 98 206 120 218 126" fill="#EA908A"/>
    <!-- glasses slid down the nose -->
    <circle cx="282" cy="100" r="11" fill="#fff" stroke-width="5"/>
    <path d="M271 98 L 226 94" fill="none" stroke-width="4"/>
    <circle cx="285" cy="100" r="2.5" fill="#3C3C3C" stroke="none"/>
    <!-- mouth: a small, unexplained "haa" -->
    <ellipse cx="282" cy="136" rx="6" ry="8" fill="#3C3C3C" stroke-width="3"/>
    <!-- shirt sleeve and forearm -->
    <path d="M170 196 C 196 190 222 196 236 206 L 228 238 C 212 236 192 232 172 232 Z" fill="#fff"/>
    <path d="M230 210 C 262 214 290 214 318 204 L 326 232 C 296 244 262 246 228 238 Z" fill="#EA908A"/>
    <!-- the newspaper, held open and sagging in the middle -->
    <path d="M318 46 L 408 30 L 498 50 L 492 244 L 404 226 L 322 246 Z" fill="#F1EEE7"/>
    <path d="M408 30 C 402 100 404 170 404 226" fill="none" stroke-width="4"/>
    <!-- hands gripping the edges -->
    <path d="M314 196 C 326 186 342 190 340 204 C 344 214 336 228 322 230 Z" fill="#EA908A"/>
  </g>
  <!-- newsprint: headline bars and scribbled columns -->
  <g fill="#3C3C3C" opacity="0.85" filter="url(#wobble)">
    <rect x="334" y="64" width="58" height="9" rx="2"/>
    <rect x="420" y="64" width="62" height="9" rx="2"/>
    <rect x="420" y="84" width="36" height="28" rx="2" opacity="0.6"/>
  </g>
  <g stroke="#3C3C3C" stroke-width="2.4" stroke-linecap="round" opacity="0.6" filter="url(#wobble)">
    <path d="M334 88 h58 M334 100 h52 M334 112 h58 M334 124 h46 M334 136 h56 M334 148 h50 M334 160 h58 M334 172 h40 M334 184 h54 M334 196 h48 M334 208 h44"/>
    <path d="M462 88 h22 M462 100 h20 M462 112 h22 M420 126 h64 M420 138 h58 M420 150 h64 M420 162 h52 M420 174 h62 M420 186 h56 M420 198 h60 M420 210 h44"/>
  </g>
</svg>
