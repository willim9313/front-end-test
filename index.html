<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>風格目錄</title>
  <meta name="description" content="個人收藏的視覺風格研究頁目錄，可依類型、配色、字體、手法與素材狀態篩選。" />
  <link rel="stylesheet" href="overview/overview.css" />
  <script src="overview/catalog.js" defer></script>
  <script src="overview/spec.js" defer></script>
  <script src="overview/overview.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top__title">
      <h1>風格目錄</h1>
      <p class="top__count" aria-live="polite" data-count></p>
    </div>
    <label class="search">
      <span class="visually-hidden">搜尋</span>
      <input type="search" placeholder="搜尋名稱、字體、氣氛…" autocomplete="off" data-search />
    </label>
  </header>

  <section class="filters" aria-label="篩選">
    <div data-facets></div>
    <button type="button" class="filters__clear" data-clear hidden>清除篩選</button>
  </section>

  <main>
    <ul class="grid" data-grid></ul>
    <p class="empty" data-empty hidden>沒有符合的風格。試著拿掉一些篩選條件。</p>
  </main>

  <footer class="foot">
    <p>每個風格都是看著別人作品做的練習，原作版權屬原作者。出處見 <a href="CREDITS.md">CREDITS.md</a>。</p>
  </footer>
</body>
</html>
